# db(PostgreSQL),app(Flask)のコンテナを作成（Renderデプロイ確認用）
services:

# MySQL
  db:
    # コンテナ名をMySQLに指定
    container_name: PostgreSQL
    # MySQLのDockerfileをビルドする。コンテキストはカレントディレクトリ
    build:
      context: .
      dockerfile: docker/PostgreSQL/Dockerfile.prod
    # M1チップでも動くように
    # Intel Macの場合あってもなくても動く
    platform: linux/x86_64
    # ホストとコンテナのポート番号を指定
    ports:
      - "5432:5432"
    # ボリュームpostgresql_dataをコンテナの/var/lib/postgresqlにボリュームマウントする
    volumes:
      - postgresql_data:/var/lib/postgresql
      - ./docker/PostgreSQL/initdb:/docker-entrypoint-initdb.d
    # コンテナの環境変数を設定
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=Asia/Tokyo
    # .envファイルから環境変数を読み込む
    env_file:
      - .env.prod
    healthcheck:
      # pg_isreadyを使ってDBコンテナ自身（localhost:127.0.0.1)にpingを送ってヘルスチェックを行う
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      # ヘルスチェックのインターバルは10秒
      interval: 10s
      # タイムアウト時間は10秒
      timeout: 10s
      # リトライ回数は3回
      retries: 3
      # ヘルスチェックが失敗しても無視する時間は30秒
      start_period: 30s
    networks:
      - vslog_prod_network

# Flask
  app:
    # コンテナ名をFlaskに変更
    container_name: Flask_prod
    # FlaskのDockerfileをビルドする。コンテキストはカレントディレクトリ
    build:
      context: .
      dockerfile: docker/Flask/Dockerfile.prod
    # ローカルのsrc, migrations, testsをコンテナにバインドマウントする
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./tests:/app/tests
    # ホストとコンテナのポート番号を指定
    ports:
      - "${FLASK_PORT}:5000"
    environment:
      - FLASK_APP=${FLASK_APP}
      - FLASK_ENV=${FLASK_ENV}
      - TZ=Asia/Tokyo
    # dbサービスがhealthyになるまで待機
    depends_on:
      db:
        condition: service_healthy
    command: wait-for-it.sh db:5432 -- sh -c "flask db upgrade && flask run --host=0.0.0.0 --debug"
    # .envファイルから環境変数を読み込む
    env_file:
      - .env.prod
    networks:
      - vslog_prod_network

networks:
  vslog_prod_network:

volumes:
  postgresql_data:


